<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>TikTok Music</title>
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
  <h1>Лучшие треки из TikTok!</h1>
  <p>Нажмите на кнопку "Создать токен" для получения токена.</p>
  <p>Токенов: <span id="token-count">0</span></p>
  <button id="create-token">Создать токен</button>
  <ul id="tasks"></ul>
  <div class="tracks">
  <div class="track-item">
    <span>Psycho Dreams</span>
    <button class="buy-track" data-track="Kill_Eva_ENCASSATOR_-_Psycho_Dreams_81436236.mp3">Купить трек за 20 т</button>
  </div>
  <div class="track-item">
    <span>целоваться</span>
    <button class="buy-track" data-track="lightprey_-_celovatsya_81497234.mp3">Купить трек за 20 т</button>
  </div>
  <div class="track-item">
    <span>Самый лучший день</span>
    <button class="buy-track" data-track="Kishlak_-_Samyjj_luchshijj_den_79483097.mp3">Купить трек за 20 т</button>
  </div>
</div>

  <script src="script.js"></script>
</body>
</html>
